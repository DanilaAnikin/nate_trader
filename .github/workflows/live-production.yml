name: V11 Live Production (REAL MONEY)

# Real orders against a funded brokerage account.
#
# Deliberately different from `paper-production.yml` in three ways, each of
# which is the point rather than an oversight:
#
#   1. There is NO `schedule:`. Nothing here ever fires on its own. A live cycle
#      happens because a person went to the Actions tab and started one. Adding
#      a cron to this file is a decision the owner takes knowingly, not a
#      default they inherit.
#   2. It runs in its own `live-production` environment, which is where required
#      reviewers and the live secrets live. GitHub will not start the job until
#      a configured reviewer approves the run.
#   3. It asks the operator to type a confirmation phrase. A mis-clicked "Run
#      workflow" is a common accident; typing `TRADE REAL MONEY` is not.
#
# Everything the paper workflow gates on is gated on here identically — the
# approved release SHA, a successful release gate for that exact SHA, the
# offline release contract, and broker preflight. Live is strictly the paper
# path plus more refusals, never fewer.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only preflight, or one guarded real-money execution"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - execute
      confirmation:
        description: "To execute, type exactly: TRADE REAL MONEY"
        required: false
        default: ""
        type: string

concurrency:
  # Shares the PAPER trader's group, which is what makes the property real: two
  # cycles must never converge the same strategy against two different brokers
  # at once. The group string was `nate-trader-v11-production` until 2026-09-08
  # and the comment claimed it shared the paper trader's group — it did not.
  # paper-production.yml uses `nate-trader-v11-paper-production`, so the two
  # workflows had no mutual exclusion at all and the comment documented a
  # safety property that did not exist.
  #
  # The name still says "paper" because paper-production.yml is a
  # strategy-identity source: renaming its group would change the identity hash
  # and invalidate every validation report, for cosmetics. Matching the existing
  # string is the change that costs nothing and buys the exclusion.
  group: nate-trader-v11-paper-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.12.11"
  APPROVED_RELEASE_SHA: ${{ vars.PRODUCTION_RELEASE_SHA }}
  TRADING_MODE: live
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  live-execution:
    name: Guarded real-money cycle
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: live-production

    steps:
      - name: Require the typed confirmation for an execution
        if: inputs.operation == 'execute'
        env:
          LIVE_EXECUTION_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "${LIVE_EXECUTION_CONFIRMATION:-}" != "TRADE REAL MONEY" ]; then
            echo "::error::execution requires the confirmation phrase 'TRADE REAL MONEY'"
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Checkout immutable release input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.PRODUCTION_RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify immutable release approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$APPROVED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::PRODUCTION_RELEASE_SHA is not a full commit SHA"
            exit 1
          fi
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$APPROVED_RELEASE_SHA" ]; then
            echo "::error::checkout does not match the approved release"
            exit 1
          fi
          successful_gate_count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/v11-release.yml/runs?event=push&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$APPROVED_RELEASE_SHA\")] | length")
          if [ "$successful_gate_count" -lt 1 ]; then
            echo "::error::no successful V11 release gate exists for the approved SHA"
            exit 1
          fi

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked production dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Restore latest private live runtime-state artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A SEPARATE artifact namespace from the paper trader. The two books
          # have different positions and different performance; restoring one
          # into the other would make the executor converge against a portfolio
          # that does not exist at this broker.
          artifact_name="live-runtime-state-${APPROVED_RELEASE_SHA}"
          artifact_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -z "$artifact_id" ]; then
            echo "No prior live runtime artifact; using the release seed state."
            exit 0
          fi
          runtime_dir=$(mktemp -d)
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$runtime_dir/runtime.zip"
          unzip -q "$runtime_dir/runtime.zip" -d "$runtime_dir/restored"
          python - \
            "$runtime_dir/restored/performance.json" \
            "$runtime_dir/restored/positions.json" \
            "$runtime_dir/restored/production/last_run.json" \
            "$APPROVED_RELEASE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          performance_path, positions_path, run_path = map(Path, sys.argv[1:4])
          approved_sha = sys.argv[4]
          performance = json.loads(performance_path.read_text(encoding="utf-8"))
          positions = json.loads(positions_path.read_text(encoding="utf-8"))
          last_run = json.loads(run_path.read_text(encoding="utf-8"))
          if not isinstance(performance, dict):
              raise SystemExit("runtime performance state is not an object")
          if not isinstance(positions, dict) or not isinstance(
              positions.get("positions"), list
          ):
              raise SystemExit("runtime positions state is invalid")
          # The mirror image of the paper workflow's check. That one refuses
          # anything not flagged paper_only; this one refuses anything that IS.
          # Neither lineage can ever restore the other's state.
          if not isinstance(last_run, dict) or (
              last_run.get("schema_version") != 1
              or last_run.get("kind") != "v11_live_production_run"
              or last_run.get("paper_only") is not False
              or last_run.get("release_sha") != approved_sha
          ):
              raise SystemExit("runtime artifact release lineage is invalid")
          PY
          for name in performance.json positions.json; do
            install -D -m 600 "$runtime_dir/restored/$name" "state/$name"
          done
          mkdir -p state/production
          cp -a "$runtime_dir/restored/production/." state/production/
          echo "Restored live runtime state from artifact ${artifact_id}."

      - name: Verify offline release contract
        env:
          ALPACA_LIVE_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED }}
          LIVE_TRADING_ACCOUNT_NUMBER: ${{ vars.LIVE_TRADING_ACCOUNT_NUMBER }}
          LIVE_MAX_ORDER_NOTIONAL_USD: ${{ vars.LIVE_MAX_ORDER_NOTIONAL_USD }}
          LIVE_MAX_CYCLE_NOTIONAL_USD: ${{ vars.LIVE_MAX_CYCLE_NOTIONAL_USD }}
        run: python scripts/sanity_check.py

      - name: Verify live broker and deployment health
        env:
          ALPACA_LIVE_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED }}
          LIVE_TRADING_ACCOUNT_NUMBER: ${{ vars.LIVE_TRADING_ACCOUNT_NUMBER }}
          LIVE_MAX_ORDER_NOTIONAL_USD: ${{ vars.LIVE_MAX_ORDER_NOTIONAL_USD }}
          LIVE_MAX_CYCLE_NOTIONAL_USD: ${{ vars.LIVE_MAX_CYCLE_NOTIONAL_USD }}
        run: |
          set -euo pipefail
          python scripts/production_preflight.py | tee production-preflight.json

      - name: Read-only strategy preview
        env:
          ALPACA_LIVE_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED }}
          LIVE_TRADING_ACCOUNT_NUMBER: ${{ vars.LIVE_TRADING_ACCOUNT_NUMBER }}
          LIVE_MAX_ORDER_NOTIONAL_USD: ${{ vars.LIVE_MAX_ORDER_NOTIONAL_USD }}
          LIVE_MAX_CYCLE_NOTIONAL_USD: ${{ vars.LIVE_MAX_CYCLE_NOTIONAL_USD }}
        run: |
          set -euo pipefail
          python scripts/execute_trades.py dry-run | tee production-dry-run.log

      - name: Execute one guarded real-money cycle
        id: execute
        if: inputs.operation == 'execute'
        env:
          ALPACA_LIVE_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED }}
          LIVE_TRADING_ACCOUNT_NUMBER: ${{ vars.LIVE_TRADING_ACCOUNT_NUMBER }}
          LIVE_MAX_ORDER_NOTIONAL_USD: ${{ vars.LIVE_MAX_ORDER_NOTIONAL_USD }}
          LIVE_MAX_CYCLE_NOTIONAL_USD: ${{ vars.LIVE_MAX_CYCLE_NOTIONAL_USD }}
        run: |
          set -euo pipefail
          python scripts/production_run.py | tee production-execution.json

      - name: Preserve private live runtime state
        if: always() && steps.execute.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-runtime-state-${{ vars.PRODUCTION_RELEASE_SHA }}
          path: |
            state/performance.json
            state/positions.json
            state/production/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Preserve preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-diagnostics
          path: |
            production-preflight.json
            production-dry-run.log
            production-execution.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Open one operational incident on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="V11 LIVE production is failing"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failure repeated: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            gh issue create --title "$title" \
              --body "A real-money cycle failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
