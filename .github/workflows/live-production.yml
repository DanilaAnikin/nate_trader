name: V11 Live Production (REAL MONEY)

# Real orders against a funded brokerage account.
#
# Deliberately different from `paper-production.yml` in three ways, each of
# which is the point rather than an oversight:
#
#   1. There is NO `schedule:`. Nothing here ever fires on its own. A live cycle
#      happens because a person went to the Actions tab and started one. Adding
#      a cron to this file is a decision the owner takes knowingly, not a
#      default they inherit.
#   2. It runs in its own `live-production` environment, which is where required
#      reviewers and the live secrets live. GitHub will not start the job until
#      a configured reviewer approves the run.
#   3. It asks the operator to type a confirmation phrase. A mis-clicked "Run
#      workflow" is a common accident; typing `TRADE REAL MONEY` is not.
#
# Everything the paper workflow gates on is gated on here identically — the
# approved release SHA, a successful release gate for that exact SHA, the
# offline release contract, and broker preflight. Live is strictly the paper
# path plus more refusals, never fewer.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only preflight, or one guarded real-money execution"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - execute
      confirmation:
        description: "To execute, type exactly: TRADE REAL MONEY"
        required: false
        default: ""
        type: string

concurrency:
  # Shares the PAPER trader's group, which is what makes the property real: two
  # cycles must never converge the same strategy against two different brokers
  # at once. The group string was `nate-trader-v11-production` until 2026-09-08
  # and the comment claimed it shared the paper trader's group — it did not.
  # paper-production.yml uses `nate-trader-v11-paper-production`, so the two
  # workflows had no mutual exclusion at all and the comment documented a
  # safety property that did not exist.
  #
  # The name still says "paper" because paper-production.yml is a
  # strategy-identity source: renaming its group would change the identity hash
  # and invalidate every validation report, for cosmetics. Matching the existing
  # string is the change that costs nothing and buys the exclusion.
  group: nate-trader-v11-paper-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.12.11"
  APPROVED_RELEASE_SHA: ${{ vars.PRODUCTION_RELEASE_SHA }}
  TRADING_MODE: live
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  live-execution:
    name: Guarded real-money cycle
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: live-production

    steps:
      - name: Require the typed confirmation for an execution
        if: inputs.operation == 'execute'
        env:
          LIVE_EXECUTION_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "${LIVE_EXECUTION_CONFIRMATION:-}" != "TRADE REAL MONEY" ]; then
            echo "::error::execution requires the confirmation phrase 'TRADE REAL MONEY'"
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Checkout immutable release input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.PRODUCTION_RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify immutable release approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$APPROVED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::PRODUCTION_RELEASE_SHA is not a full commit SHA"
            exit 1
          fi
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$APPROVED_RELEASE_SHA" ]; then
            echo "::error::checkout does not match the approved release"
            exit 1
          fi
          successful_gate_count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/v11-release.yml/runs?event=push&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$APPROVED_RELEASE_SHA\")] | length")
          if [ "$successful_gate_count" -lt 1 ]; then
            echo "::error::no successful V11 release gate exists for the approved SHA"
            exit 1
          fi

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked production dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Restore latest private live runtime-state artifact
        id: restore_runtime
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_RUNTIME_KEY: ${{ secrets.LIVE_RUNTIME_KEY }}
          LIVE_RUNTIME_BOOTSTRAP: ${{ vars.LIVE_RUNTIME_BOOTSTRAP }}
          ALPACA_LIVE_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED }}
          LIVE_TRADING_ACCOUNT_NUMBER: ${{ secrets.LIVE_TRADING_ACCOUNT_NUMBER }}
          LIVE_CAPITAL_BUDGET_USD: ${{ vars.LIVE_CAPITAL_BUDGET_USD }}
          LIVE_MAX_ORDER_NOTIONAL_USD: ${{ vars.LIVE_MAX_ORDER_NOTIONAL_USD }}
          LIVE_MAX_CYCLE_NOTIONAL_USD: ${{ vars.LIVE_MAX_CYCLE_NOTIONAL_USD }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/restore_live_runtime.py ]; then
            echo '::error::Approved release has no verified live runtime restore contract.'
            exit 1
          fi
          python scripts/restore_live_runtime.py

      - name: Verify offline release contract
        env:
          ALPACA_LIVE_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED }}
          LIVE_TRADING_ACCOUNT_NUMBER: ${{ secrets.LIVE_TRADING_ACCOUNT_NUMBER }}
          LIVE_CAPITAL_BUDGET_USD: ${{ vars.LIVE_CAPITAL_BUDGET_USD }}
          LIVE_MAX_ORDER_NOTIONAL_USD: ${{ vars.LIVE_MAX_ORDER_NOTIONAL_USD }}
          LIVE_MAX_CYCLE_NOTIONAL_USD: ${{ vars.LIVE_MAX_CYCLE_NOTIONAL_USD }}
          LIVE_RUNTIME_KEY: ${{ secrets.LIVE_RUNTIME_KEY }}
        run: python scripts/live_runtime_crypto.py run-step sanity

      - name: Verify live broker and deployment health
        env:
          ALPACA_LIVE_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED }}
          LIVE_TRADING_ACCOUNT_NUMBER: ${{ secrets.LIVE_TRADING_ACCOUNT_NUMBER }}
          LIVE_CAPITAL_BUDGET_USD: ${{ vars.LIVE_CAPITAL_BUDGET_USD }}
          LIVE_MAX_ORDER_NOTIONAL_USD: ${{ vars.LIVE_MAX_ORDER_NOTIONAL_USD }}
          LIVE_MAX_CYCLE_NOTIONAL_USD: ${{ vars.LIVE_MAX_CYCLE_NOTIONAL_USD }}
          LIVE_RUNTIME_KEY: ${{ secrets.LIVE_RUNTIME_KEY }}
        run: |
          set -euo pipefail
          python scripts/live_runtime_crypto.py run-step preflight

      - name: Read-only strategy preview
        env:
          ALPACA_LIVE_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED }}
          LIVE_TRADING_ACCOUNT_NUMBER: ${{ secrets.LIVE_TRADING_ACCOUNT_NUMBER }}
          LIVE_CAPITAL_BUDGET_USD: ${{ vars.LIVE_CAPITAL_BUDGET_USD }}
          LIVE_MAX_ORDER_NOTIONAL_USD: ${{ vars.LIVE_MAX_ORDER_NOTIONAL_USD }}
          LIVE_MAX_CYCLE_NOTIONAL_USD: ${{ vars.LIVE_MAX_CYCLE_NOTIONAL_USD }}
          LIVE_RUNTIME_KEY: ${{ secrets.LIVE_RUNTIME_KEY }}
        run: |
          set -euo pipefail
          python scripts/live_runtime_crypto.py run-step preview

      - name: Execute one guarded real-money cycle
        id: execute
        if: inputs.operation == 'execute'
        env:
          ALPACA_LIVE_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED }}
          LIVE_TRADING_ACCOUNT_NUMBER: ${{ secrets.LIVE_TRADING_ACCOUNT_NUMBER }}
          LIVE_CAPITAL_BUDGET_USD: ${{ vars.LIVE_CAPITAL_BUDGET_USD }}
          LIVE_MAX_ORDER_NOTIONAL_USD: ${{ vars.LIVE_MAX_ORDER_NOTIONAL_USD }}
          LIVE_MAX_CYCLE_NOTIONAL_USD: ${{ vars.LIVE_MAX_CYCLE_NOTIONAL_USD }}
          LIVE_RUNTIME_KEY: ${{ secrets.LIVE_RUNTIME_KEY }}
        run: |
          set -euo pipefail
          python scripts/live_runtime_crypto.py run-step execute

      - name: Encrypt executed live runtime state
        id: pack_runtime
        if: >-
          always() && steps.restore_runtime.outcome == 'success' &&
          (steps.execute.outcome == 'success' || steps.execute.outcome == 'failure' ||
           steps.execute.outcome == 'cancelled')
        env:
          LIVE_RUNTIME_KEY: ${{ secrets.LIVE_RUNTIME_KEY }}
        run: python scripts/live_runtime_crypto.py pack-runtime

      - name: Preserve private live runtime state
        if: always() && steps.pack_runtime.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-runtime-state-${{ vars.PRODUCTION_RELEASE_SHA }}
          path: live-private/runtime.aesgcm
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Preserve encrypted preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-diagnostics
          path: live-private/diagnostics/*.aesgcm
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0

      - name: Open one operational incident on failure
        if: failure() && inputs.operation == 'execute'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="V11 LIVE production is failing"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failure repeated: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            gh issue create --title "$title" \
              --body "A real-money cycle failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
