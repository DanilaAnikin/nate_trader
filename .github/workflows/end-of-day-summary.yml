name: End-of-Day Summary

on:
  schedule:
    - cron: '15 20 * * 1-5'  # 4:15 PM ET (UTC-4)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Pull latest
        run: git pull --rebase origin main
        working-directory: .

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: .

      - name: Save portfolio state
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 portfolio.py save

      - name: Refresh SPY benchmark
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 research.py spy

      - name: Write daily journal
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 write_journal.py daily

      - name: Send daily recap notification
        env:
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
        run: |
          python3 -c "
          from notify import send_daily_recap
          from utils import load_json, PERFORMANCE_STATE
          perf = load_json(PERFORMANCE_STATE)
          parts = []
          parts.append('Equity: \$' + f'{perf.get(\"equity\", 0):,.2f}')
          parts.append('Daily P&L: \$' + f'{perf.get(\"daily_pnl\", 0):,.2f} ({perf.get(\"daily_pnl_pct\", 0):+.2f}%)')
          parts.append('Weekly P&L: \$' + f'{perf.get(\"weekly_pnl\", 0):,.2f} ({perf.get(\"weekly_pnl_pct\", 0):+.2f}%)')
          parts.append('Monthly P&L: \$' + f'{perf.get(\"monthly_pnl\", 0):,.2f} ({perf.get(\"monthly_pnl_pct\", 0):+.2f}%)')
          parts.append('Positions: ' + str(perf.get('num_positions', 0)))
          parts.append('Risk Tier: ' + perf.get('risk_tier', 'NORMAL'))
          send_daily_recap(chr(10).join(parts))
          "

      - name: Commit and push state
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ journal/ memory/ watchlist.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "routine: end-of-day summary $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
