name: graduated-gate-shadow

# Pre-registered forward paper experiment (RESEARCH ONLY). Once a week it refreshes
# market data and re-runs the graduated-gate harness, appending a dated snapshot to
# the research branch's record. It runs the BACKTEST ENGINE on data — it opens no
# broker connection, places no orders, and never touches the production trader,
# the approved release, or main. The experiment CODE lives only on the research
# branch (editing the strategy sources would change V11's identity hash), which
# this schedule (necessarily on the default branch) checks out to run.
#
# Design and success criteria are frozen in
# strategy/experiments/graduated_gate_forward_protocol.md and must not change.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays ~06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graduated-gate-shadow
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.11"
  EXPERIMENT_BRANCH: research/graduated-gate

jobs:
  shadow:
    name: Extend the forward experiment record
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the experiment branch (floor code + harness + record)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research/graduated-gate
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh market data (yfinance; no broker keys)
        # yfinance can rate-limit from CI IPs; a failed refresh must not fail the
        # experiment — the harness then runs on whatever bars are cached and simply
        # does not extend the forward window that week.
        continue-on-error: true
        run: python scripts/backtest/download_history.py --start 2020-01-01

      - name: Append a forward snapshot
        run: python scripts/experiments/graduated_gate_forward.py --stamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Commit the record to the experiment branch
        run: |
          if git diff --quiet -- state/experiments/graduated_gate_forward.json; then
            echo "record unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "graduated-gate-shadow"
          git config user.email "actions@users.noreply.github.com"
          git add state/experiments/graduated_gate_forward.json
          git commit -m "research: forward experiment snapshot $(date -u +%Y-%m-%d)"
          # Rebase onto origin before pushing so a commit that landed on the
          # branch since checkout (e.g. a manual edit) makes this a fast-forward
          # rather than a rejected non-fast-forward that silently drops the week's
          # snapshot. The harness appends only to the record file, so a rebase
          # re-applies this commit cleanly.
          git fetch origin "${EXPERIMENT_BRANCH}"
          git rebase "origin/${EXPERIMENT_BRANCH}"
          git push origin HEAD:${EXPERIMENT_BRANCH}
