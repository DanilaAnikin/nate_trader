name: Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'single'
        type: choice
        options:
          - single
          - sweep
          - monte-carlo
          - walk-forward
          - compare
          - download
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2021-01-01'
      end_date:
        description: 'End date (YYYY-MM-DD, blank = today)'
        required: false
        default: ''
      n_monte_carlo:
        description: 'Monte Carlo simulations (monte-carlo only)'
        required: false
        default: '200'
      train_months:
        description: 'Walk-forward train window (months)'
        required: false
        default: '12'
      test_months:
        description: 'Walk-forward test window (months)'
        required: false
        default: '6'
      windows:
        description: 'Walk-forward number of windows'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download / refresh historical bars
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 scripts/backtest/run.py download --start ${{ inputs.start_date }}

      - name: Run backtest (${{ inputs.mode }})
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          END_ARG=""
          if [ -n "${{ inputs.end_date }}" ]; then
            END_ARG="--end ${{ inputs.end_date }}"
          fi
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "single" ]; then
            python3 scripts/backtest/run.py single --start ${{ inputs.start_date }} $END_ARG
          elif [ "$MODE" = "sweep" ]; then
            python3 scripts/backtest/run.py sweep --start ${{ inputs.start_date }} $END_ARG
          elif [ "$MODE" = "monte-carlo" ]; then
            python3 scripts/backtest/run.py monte-carlo --start ${{ inputs.start_date }} $END_ARG --n ${{ inputs.n_monte_carlo }}
          elif [ "$MODE" = "walk-forward" ]; then
            python3 scripts/backtest/run.py walk-forward --start ${{ inputs.start_date }} $END_ARG \
              --train-months ${{ inputs.train_months }} \
              --test-months ${{ inputs.test_months }} \
              --windows ${{ inputs.windows }}
          elif [ "$MODE" = "compare" ]; then
            python3 scripts/backtest/run.py compare --start ${{ inputs.start_date }} $END_ARG
          elif [ "$MODE" = "download" ]; then
            python3 scripts/backtest/run.py download --start ${{ inputs.start_date }}
          fi

      - name: Commit and push results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # If nothing was produced, exit early.
          if [ -z "$(git status --porcelain state/backtest/ 2>/dev/null)" ]; then
            echo "No backtest output to commit"
            exit 0
          fi

          # Manifest is rebuilt deterministically from runs/ on disk after every
          # pull, so we throw away local manifest changes before pulling. The
          # archive (runs/*.json) and the legacy latest_result are append-only
          # and never conflict with concurrent workflows.
          for attempt in 1 2 3; do
            echo "── push attempt $attempt/3 ──"
            git checkout state/backtest/manifest.json 2>/dev/null || true

            # Make sure local main is at remote tip. Other workflows (e.g. SPY
            # history) may have pushed since this backtest started.
            if ! git pull --rebase=true --autostash origin main; then
              echo "  pull --rebase failed; aborting any in-flight rebase"
              git rebase --abort 2>/dev/null || true
              git stash pop 2>/dev/null || true
              sleep 10
              continue
            fi

            # Reconstruct manifest from the on-disk union of all runs/ files
            # — including any new ones pulled in from concurrent workflows.
            python3 scripts/backtest/rebuild_manifest.py

            git add state/backtest/
            if git diff --cached --quiet; then
              echo "  nothing left to commit after rebuild"
              exit 0
            fi
            git commit -m "backtest: ${{ inputs.mode }} run $(date +%Y-%m-%d)"

            if git push origin main; then
              echo "  pushed on attempt $attempt"
              exit 0
            fi

            echo "  push rejected — undoing commit and retrying"
            git reset --soft HEAD~1
            sleep 10
          done

          echo "Failed to push backtest result after 3 attempts"
          exit 1
