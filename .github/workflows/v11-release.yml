name: V11 Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install production lock and test tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest==9.1.1 ruff==0.16.1
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run complete regression suite
        run: PYTHONPATH=scripts python -m pytest -q
      - name: Compile all Python sources
        run: python -m compileall -q scripts tests
      - name: Lint deployment boundary
        run: >-
          ruff check
          --select E9,F63,F7,F82
          scripts/production_preflight.py
          scripts/production_run.py
          scripts/sanity_check.py
          scripts/strategy_identity.py
      - name: Verify canonical promotion artifact
        run: python scripts/sanity_check.py
