name: V11 Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install locked dashboard dependencies
        run: npm ci
      - name: Reject vulnerable dashboard dependencies
        run: npm audit --audit-level=high
      - name: Test dashboard contracts
        run: npm test
      - name: Lint and type-check dashboard
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Build production dashboard
        run: npm run build
      # Non-trading, and previously only ever claimed as a local result. The
      # fail-closed suite asserts that no route serves anything without an
      # authentication backend and that no credential reaches the browser, so
      # it belongs in the gate rather than in a report.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end fail-closed suite
        run: npx playwright test

  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install production lock and test tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest==9.1.1 ruff==0.16.1
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run complete regression suite
        run: PYTHONPATH=scripts python -m pytest -q
      - name: Compile all Python sources
        run: python -m compileall -q scripts tests
      - name: Lint deployment boundary
        run: >-
          ruff check
          --select E9,F63,F7,F82
          scripts tests
      - name: Verify canonical promotion artifact
        run: python scripts/sanity_check.py

  supabase-schema-gate:
    name: Supabase schema and RLS integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      # Applies every real migration to a real PostgreSQL server and then
      # asserts the accounts lockdown against it. This is a database test, not
      # a grep over SQL text: the policies, grants and triggers exercised here
      # are the ones the migrations actually create.
      - name: Apply migrations and run RLS assertions
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: supabase/tests/run_integration.sh

  # Non-trading. Exercises the ACL and the history snapshot through a real
  # PostgREST, because the `/rpc/` surface, the role switching and the
  # `db-max-rows` cap are its behaviour, not the database's — a migration can
  # revoke perfectly and still leave a function callable. Runs with a 100-row
  # cap so a reader that assumes 1000, or infers "short page means done",
  # fails loudly instead of returning a plausible wrong number.
  postgrest-gate:
    name: PostgREST API surface
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run the PostgREST integration gate
        run: supabase/tests/run_postgrest.sh

  # Non-trading. The two races that a single-connection test cannot reach: two
  # transactions that each read state the other has not committed yet. Both
  # were real — concurrent account creation with the same Vault ids committed
  # twice, and an older refresh could publish over a newer one.
  concurrency-gate:
    name: Concurrency races
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run the concurrency gate
        run: supabase/tests/run_concurrency.sh
