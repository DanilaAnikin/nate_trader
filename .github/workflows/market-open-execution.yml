name: Market-Open Execution

on:
  schedule:
    - cron: '0 14 * * 1-5'  # 10:00 AM ET (UTC-4)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Pull latest
        run: git pull --rebase origin main
        working-directory: .

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: .

      - name: Check market status
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 trade.py market

      - name: Execute trades
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
        run: python3 execute_trades.py run

      - name: Save portfolio state
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 portfolio.py save

      - name: Commit and push state
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ journal/ memory/ watchlist.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "routine: market-open execution $(date +%Y-%m-%d)"
          # Push with retry: a concurrent routine may advance main between our
          # rebase and push. Re-fetch and replay our commit until it lands.
          for attempt in 1 2 3 4 5; do
            echo "── push attempt $attempt/5 ──"
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to push after 5 attempts"
          exit 1
