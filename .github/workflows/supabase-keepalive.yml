name: Supabase Keepalive

# Free-tier Supabase projects auto-pause after ~7 days without database
# activity. A paused project takes the whole dashboard down (every gated
# route 504s) and breaks Supabase Sync. This makes one tiny query a day —
# every day, weekends included — so the project never goes idle long enough
# to pause.

on:
  schedule:
    - cron: '17 12 * * *'  # 12:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Supabase secrets not configured — nothing to ping."
            exit 0
          fi
          # A real table read touches Postgres (not just the API gateway), which
          # is what counts as activity for the auto-pause timer.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/accounts?select=id&limit=1")
          echo "Supabase responded with HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Unexpected status — the project may be paused or misconfigured."
            exit 1
          fi
          echo "Supabase is awake."
