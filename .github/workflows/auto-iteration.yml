name: Auto-Iteration (nightly backtest + ML training)

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily (~22:00 ET, after EOD summary)
  workflow_dispatch:
    inputs:
      train_ml:
        description: 'Retrain ML model'
        required: false
        default: 'true'
      refresh_sentiment:
        description: 'Refresh Reddit sentiment'
        required: false
        default: 'true'
      refresh_yf_earnings:
        description: 'Refresh yfinance earnings'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: git pull --rebase origin main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Refresh yfinance earnings calendar + history
        if: github.event.inputs.refresh_yf_earnings != 'false'
        run: python3 scripts/yf_earnings.py refresh
        continue-on-error: true

      - name: Refresh Reddit sentiment
        if: github.event.inputs.refresh_sentiment != 'false'
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python3 scripts/sentiment.py refresh
        continue-on-error: true

      - name: Train ML model
        if: github.event.inputs.train_ml != 'false'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python3 scripts/backtest/run.py download --start 2020-01-01 || true
          python3 scripts/ml_signals.py train

      - name: Run nightly backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 scripts/backtest/run.py single --start 2021-01-01

      - name: Append to alpha tracker
        run: python3 scripts/auto_iteration.py track

      - name: Commit results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git checkout state/backtest/manifest.json 2>/dev/null || true
            git pull --rebase=true --autostash origin main || { git rebase --abort 2>/dev/null; sleep 5; continue; }
            python3 scripts/backtest/rebuild_manifest.py
            git add state/ -A
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "auto-iteration $(date +%Y-%m-%d)"
            if git push origin main; then exit 0; fi
            git reset --soft HEAD~1
            sleep 5
          done
