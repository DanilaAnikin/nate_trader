name: V11 Paper Production

on:
  schedule:
    # 10:05 EST / 11:05 EDT, safely inside regular US market hours.
    - cron: "5 15 * * 1-5"
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only preflight, or one guarded paper execution"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - execute

concurrency:
  group: nate-trader-v11-paper-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.12.11"
  APPROVED_RELEASE_SHA: ${{ vars.PRODUCTION_RELEASE_SHA }}
  TRADING_MODE: paper
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  paper-forward-validation:
    name: Guarded paper forward-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: paper-production

    steps:
      - name: Checkout immutable release input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.PRODUCTION_RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify immutable release approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$APPROVED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::paper-production PRODUCTION_RELEASE_SHA is not a full commit SHA"
            exit 1
          fi
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$APPROVED_RELEASE_SHA" ]; then
            echo "::error::checkout does not match the approved paper release"
            exit 1
          fi
          successful_gate_count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/v11-release.yml/runs?event=push&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$APPROVED_RELEASE_SHA\")] | length")
          if [ "$successful_gate_count" -lt 1 ]; then
            echo "::error::no successful V11 release gate exists for the approved SHA"
            exit 1
          fi

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked production dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Restore latest private runtime-state artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="paper-runtime-state-${APPROVED_RELEASE_SHA}"
          artifact_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -z "$artifact_id" ]; then
            echo "No prior runtime artifact; using the release seed state."
            exit 0
          fi
          runtime_dir=$(mktemp -d)
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$runtime_dir/runtime.zip"
          unzip -q "$runtime_dir/runtime.zip" -d "$runtime_dir/restored"
          python - \
            "$runtime_dir/restored/performance.json" \
            "$runtime_dir/restored/positions.json" \
            "$runtime_dir/restored/production/last_run.json" \
            "$APPROVED_RELEASE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          performance_path, positions_path, run_path = map(Path, sys.argv[1:4])
          approved_sha = sys.argv[4]
          performance = json.loads(performance_path.read_text(encoding="utf-8"))
          positions = json.loads(positions_path.read_text(encoding="utf-8"))
          last_run = json.loads(run_path.read_text(encoding="utf-8"))
          if not isinstance(performance, dict):
              raise SystemExit("runtime performance state is not an object")
          if not isinstance(positions, dict) or not isinstance(
              positions.get("positions"), list
          ):
              raise SystemExit("runtime positions state is invalid")
          if not isinstance(last_run, dict) or (
              last_run.get("schema_version") != 1
              or last_run.get("kind") != "v11_paper_production_run"
              or last_run.get("paper_only") is not True
              or last_run.get("release_sha") != approved_sha
          ):
              raise SystemExit("runtime artifact release lineage is invalid")
          PY
          for name in performance.json positions.json; do
            install -D -m 600 "$runtime_dir/restored/$name" "state/$name"
          done
          mkdir -p state/production
          cp -a "$runtime_dir/restored/production/." state/production/
          echo "Restored runtime state from artifact ${artifact_id}."

      - name: Verify offline release contract
        run: python scripts/sanity_check.py

      - name: Verify paper broker and deployment health
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/production_preflight.py | tee production-preflight.json

      - name: Read-only strategy preview
        if: github.event_name == 'workflow_dispatch'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/execute_trades.py dry-run | tee production-dry-run.log

      - name: Execute one guarded paper cycle
        id: execute
        if: github.event_name == 'schedule' || inputs.operation == 'execute'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/production_run.py | tee production-execution.json

      - name: Preserve private runtime state
        if: always() && steps.execute.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-runtime-state-${{ vars.PRODUCTION_RELEASE_SHA }}
          path: |
            state/performance.json
            state/positions.json
            state/production/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Preserve preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-diagnostics
          path: |
            production-preflight.json
            production-dry-run.log
            production-execution.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Open one operational incident on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="V11 paper production is failing"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failure repeated: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            gh issue create \
              --title "$title" \
              --label "P1" \
              --body "Fail-closed paper deployment stopped before a healthy completion. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
