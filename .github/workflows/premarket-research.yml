name: Pre-Market Research

on:
  schedule:
    - cron: '45 13 * * 1-5'  # 9:45 AM ET (UTC-4)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Pull latest
        run: git pull --rebase origin main
        working-directory: .

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: .

      - name: Sanity check (config + wiring + modules)
        env:
          # trade/portfolio/research construct their Alpaca client at import
          # time, so even a wiring-only sanity check needs credentials present
          # or the module imports raise "You must supply a method of
          # authentication" and fail the whole routine.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 sanity_check.py

      - name: Refresh sector rotation strength
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 sector_rotation.py refresh

      - name: Refresh earnings calendar (weekly cache)
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python3 earnings_calendar.py refresh

      - name: Run screener (full)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python3 screener.py full

      - name: Run research report
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 research.py report

      - name: Enhance watchlist with Perplexity
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python3 perplexity_research.py enhance

      - name: Enhance screener with Perplexity
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python3 perplexity_research.py enhance-screener

      - name: Save portfolio state
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 portfolio.py save

      - name: Commit and push state
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ journal/ memory/ watchlist.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "routine: pre-market research $(date +%Y-%m-%d)"
          # Push with retry: a concurrent routine may advance main between our
          # rebase and push. Re-fetch and replay our commit until it lands.
          for attempt in 1 2 3 4 5; do
            echo "── push attempt $attempt/5 ──"
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to push after 5 attempts"
          exit 1
