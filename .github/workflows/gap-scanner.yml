name: Pre-Market Gap Scanner

on:
  schedule:
    - cron: '35 13 * * 1-5'  # 9:35 AM ET (UTC-4) — 5 min after open
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Pull latest
        run: git pull --rebase origin main
        working-directory: .

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: .

      - name: Run gap scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 run_gap_scanner.py scan

      - name: Commit and push state
        working-directory: .
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain state/gap_signals.json 2>/dev/null)" ]; then
            echo "No gap signals change"; exit 0
          fi
          for attempt in 1 2 3; do
            git pull --rebase=true --autostash origin main || { git rebase --abort 2>/dev/null; sleep 5; continue; }
            git add state/gap_signals.json
            git diff --cached --quiet && exit 0
            git commit -m "routine: gap scanner $(date +%Y-%m-%d)"
            if git push origin main; then exit 0; fi
            git reset --soft HEAD~1
            sleep 5
          done
          echo "Push failed"; exit 1
