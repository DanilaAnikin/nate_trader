name: Refresh market data and re-validate

# Rebuilds the cached price history from Alpaca, re-runs the fixed-parameter
# validator, and opens a pull request with both.
#
# It exists because the promotion gate can be blocked by DATA rather than by
# performance, and clearing that must not require anyone to handle credentials
# by hand. The repository already holds Alpaca keys as secrets; this job borrows
# them for a read-only market-data fetch and never places an order.
#
# The case it was built for: AVB, EQR and WBS stopped refreshing because
# yfinance serves only a two-to-six-week fragment for them, and
# download_history's rebuild guard correctly refuses to overwrite six years of
# good history with that. Alpaca has the data.
#
# THREE THINGS THIS FILE DELIBERATELY DOES NOT DO, each of which it did in its
# first draft and each of which an adversarial review caught before it ran:
#
#   * It does not take a branch to check out. That input let a dispatcher run
#     ARBITRARY code with production broker secrets in scope: the environment's
#     protected-branches policy constrains the ref the run is ON, not the ref it
#     checks OUT. The checkout is now pinned to the dispatch SHA.
#   * It does not push to main. main is protected with enforce_admins, so the
#     push would be rejected after a two-hour rebuild — and the obvious
#     workaround, naming an unprotected branch, is the hole above. It opens a
#     PR, so the refreshed data passes the same checks as everything else.
#   * It does not interpolate inputs into shell text. `${{ }}` is substituted
#     before the shell parses the line, so a quote in an input escapes the
#     quoting — in the same step that exports the credentials. Inputs reach the
#     shell through `env:` only.
#
# Deliberately NOT scheduled. Rebuilding history changes the bar-snapshot
# evidence every validation report is bound to, so it happens when a person
# asks for it.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First session to rebuild from (YYYY-MM-DD)"
        required: true
        default: "2020-01-01"
        type: string

concurrency:
  # The scheduled paper trader's group. A rebuild rewrites the bars a cycle
  # reads and the validation report it is judged against, so the two must not
  # overlap. Verified against paper-production.yml rather than assumed: an
  # earlier draft used a different string and claimed in a comment that it
  # shared this one.
  group: nate-trader-v11-paper-production
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.12.11"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  refresh:
    name: Rebuild adjusted history and re-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Validate the requested start date
        env:
          START: ${{ inputs.start }}
        run: |
          set -euo pipefail
          if [[ ! "$START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::start must be YYYY-MM-DD, got '$START'"
            exit 1
          fi

      - name: Checkout the dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The commit this run was dispatched on, never a caller-supplied ref.
          # Everything below executes code from this checkout with broker
          # credentials in scope, so the code must be the code the dispatch
          # permission already authorised.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked production dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Refuse to run on a feed that would change the strategy
        run: |
          set -euo pipefail
          # V11 admits a candidate only when its 60-session median DOLLAR VOLUME
          # clears $25m, so volume is a strategy input and the venue it came
          # from is a strategy parameter in disguise. The existing cache is
          # consolidated; re-deriving that filter from single-venue volume takes
          # the eligible universe from 523 of 563 symbols to between 149 and 64.
          # That would arrive in a commit labelled "refresh adjusted history".
          if grep -q "DataFeed.IEX" scripts/backtest/download_history.py; then
            echo "::error::download_history requests a single-venue feed."
            echo "::error::A rebuild on that basis silently rewrites which"
            echo "::error::stocks the strategy is allowed to hold. Refusing."
            exit 1
          fi
          grep -q "DataFeed.SIP" scripts/backtest/download_history.py

      - name: Rebuild adjusted history
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          START: ${{ inputs.start }}
        run: |
          set -euo pipefail
          if [ -z "${ALPACA_API_KEY:-}" ] || [ -z "${ALPACA_SECRET_KEY:-}" ]; then
            echo "::error::Alpaca credentials are absent. download_history would"
            echo "::error::silently fall back to yfinance, which serves only a"
            echo "::error::short fragment for the symbols this job exists to fix,"
            echo "::error::and would report success while changing nothing."
            exit 1
          fi
          # A FULL rebuild, never --incremental: corporate-action adjustments
          # revise the cached prefix, so an incremental fetch leaves a history
          # that is internally inconsistent and is explicitly unsafe to validate
          # against.
          python scripts/backtest/download_history.py --start "$START"

      - name: Report coverage and refuse a mixed-source cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          bars = Path("state/backtest/bars")
          target = json.loads((bars / "SPY.json").read_text())["to"]
          stale = []
          for path in sorted(bars.glob("*.json")):
              end = json.loads(path.read_text())["to"]
              if end < target:
                  stale.append((path.stem, end))

          print(f"SPY history ends {target}")
          if not stale:
              print("Every symbol reaches the same final session.")
              sys.exit(0)

          print(f"{len(stale)} symbol(s) end earlier:")
          for sym, end in stale:
              print(f"  {sym}: {end}")
          print()
          # A symbol that failed to refresh keeps its PREVIOUS file. If the two
          # sources disagreed on volume the cache would carry two bases at once,
          # and the liquidity filter would preferentially select whichever names
          # were stalest. Both sources here are consolidated, so this is a
          # coverage report rather than a failure — but it is reported, because
          # the validator drops a stale name from the ranking universe and that
          # is a change to what the strategy may hold.
          print("Stale names are dropped from the ranking universe by the")
          print("validator rather than silently reused.")
          PY

      - name: Re-run the fixed-parameter validator
        run: python scripts/backtest/validate_v11.py

      - name: Verify the offline release contract
        run: python scripts/sanity_check.py

      - name: Open a pull request with the refreshed data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "refresh-market-data"
          git config user.email "actions@users.noreply.github.com"
          git add state/backtest/bars state/backtest/v11_validation.json
          if git diff --cached --quiet; then
            echo "Nothing changed; no pull request."
            exit 0
          fi
          gate=$(python -c "import json;print(json.load(open('state/backtest/v11_validation.json'))['assessment']['status'])")
          branch="data/refresh-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m "chore(data): refresh adjusted history and re-validate

          Rebuilt from Alpaca's consolidated tape by workflow run ${GITHUB_RUN_ID}.
          Promotion gate: ${gate}.

          The gate's verdict is recorded, not acted on: this job refreshes
          evidence and promotes nothing."
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(data): refresh adjusted history (gate: ${gate})" \
            --body "Automated rebuild from Alpaca's consolidated tape.

          Promotion gate after refresh: **${gate}**.

          Opened as a pull request rather than pushed, so the refreshed data
          passes the same required checks as any other change to main. Read the
          run's 'Report coverage' step for symbols whose history still ends
          early — those are dropped from the ranking universe by the validator,
          which is a change to what the strategy may hold."
