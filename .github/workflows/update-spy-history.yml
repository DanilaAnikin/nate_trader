name: Update SPY History

on:
  schedule:
    - cron: '45 20 * * 1-5'  # 4:45 PM ET (UTC-4) — 45 min after market close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Pull latest
        run: git pull --rebase origin main
        working-directory: .

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: .

      - name: Update SPY history
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 update_spy_history.py

      - name: Commit and push state
        working-directory: .
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain state/spy_history.json 2>/dev/null)" ]; then
            echo "No SPY history change to commit"
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "── push attempt $attempt/3 ──"
            git pull --rebase=true --autostash origin main || {
              git rebase --abort 2>/dev/null || true
              git stash pop 2>/dev/null || true
              sleep 5
              continue
            }
            git add state/spy_history.json
            if git diff --cached --quiet; then
              echo "  nothing to commit after rebase"
              exit 0
            fi
            git commit -m "routine: SPY history update $(date +%Y-%m-%d)"
            if git push origin main; then
              echo "  pushed on attempt $attempt"
              exit 0
            fi
            git reset --soft HEAD~1
            sleep 5
          done

          echo "Failed to push SPY history after 3 attempts"
          exit 1
